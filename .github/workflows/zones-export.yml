name: ייצוא אזורי א-17 מהמפה

# מפת החברים היא המקור היחיד לאזורי א-17. הקובץ members-k38p/data/zones.json נגזר ממנה אוטומטית,
# ומערכת בקשות הטיסה קוראת ממנו. בכל שינוי במפה הקובץ מתעדכן; בבקשת מיזוג הבדיקות חייבות לעבור.

on:
  push:
    branches: [main]
    paths:
      - 'members-k38p/index.html'
      - 'members-k38p/pamat-meta.json'
      - 'scripts/export-zones.mjs'
  pull_request:
    paths:
      - 'members-k38p/**'
      - 'scripts/**'
      - 'tests/**'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: בדיקות ייצוא
        run: node --test tests/zones.test.mjs
      - name: רענון הקובץ בענף הראשי
        if: github.event_name != 'pull_request'
        run: |
          node scripts/export-zones.mjs
          git config user.name "notam-bot"
          git config user.email "bot@users.noreply.github.com"
          git add members-k38p/data/zones.json
          if git diff --cached --quiet; then
            echo "הקובץ מעודכן"
          else
            git commit -m "ייצוא אוטומטי של אזורי א-17 מהמפה"
            git pull --rebase origin "${{ github.ref_name }}"
            git push
          fi
